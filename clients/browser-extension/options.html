<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>prax capture options</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="options">
  <form id="form" autocomplete="off">
    <label>Server
      <input id="server" type="url" placeholder="http://127.0.0.1:8000 or http://<host on your private network>:8000" required>
      <small class="muted">The door's address. Saving asks the browser for permission to talk to it.</small>
    </label>
    <label>Access token
      <input id="token" type="password" placeholder="PRAX_TOKEN (empty on the desktop: loopback needs none)">
      <small class="muted">Kept in this browser's extension storage only.</small>
    </label>
    <label>Default domains
      <div id="domains" class="chips"><span class="muted">save the server first, then the door's modules appear here</span></div>
    </label>
    <label class="row"><input id="close" type="checkbox"> close tabs after "send all tabs in window"</label>
    <label>Domains by site
      <textarea id="site_rules" rows="3" placeholder="youtube.com studio&#10;arxiv.org research" spellcheck="false"></textarea>
      <small class="muted">One line per site: the host, then the domains (comma or space separated). A page of that site — or a subdomain of it — is sent with those instead of the defaults; the popup preselects them.</small>
    </label>
    <label>Video frames
      <span class="row">a frame every <input id="frame_interval" type="number" min="5" max="600" step="5" value="30" style="width:5em"> seconds of a video (at most 150; a frame like the one before is dropped)</span>
    </label>
    <div class="actions">
      <button>Save</button>
      <button type="button" id="test" class="secondary">Test connection</button>
      <span id="msg"></span>
    </div>
  </form>
  <script src="lib.js"></script>
  <script src="options.js"></script>
</body>
</html>
