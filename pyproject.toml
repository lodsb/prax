[project]
name = "prax"
version = "0.0.1"
description = "Personal research knowledge base: SQLite, hybrid search, an evidence-bearing graph, doors for people and models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["knowledge-base", "sqlite", "fts5", "retrieval", "knowledge-graph", "mcp", "zotero"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=2,<3",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "pyyaml>=6",
    "anthropic>=1",
    "httpx>=0.27",
    "networkx>=3",  # the regions of the library (prax.graph.communities)
]

[project.optional-dependencies]
ingest = ["pymupdf4llm", "rapidocr", "python-bidi>=0.6", "trafilatura", "magika", "striprtf", "pillow", "py3langid"]   # parsing; rapidocr is what the OCR extractor runs (declared: it used to arrive with Docling and left with it) and python-bidi what it needs for right-to-left scripts; magika: code detection; py3langid: the language of a text (prax.text.language falls back to stopwords without it)
docling = ["docling"]                         # optional extractor; ~3 GB of PyTorch
embed = ["usearch>=2.12", "onnxruntime", "tokenizers", "numpy"]  # Stage 2; Windows GPU: onnxruntime-directml instead (never both)
serve = ["prax[embed]"]                       # the door on the board: the core plus vectors for hybrid search; nothing else
work = ["prax[embed,ingest]"]                 # the worker on the machine with the models: parse, titles, extract, embed
tray = ["pystray>=0.19", "pillow"]           # the tray icon of `prax up --tray` on a desktop
train = ["torch>=2.8", "transformers>=5.17,<6", "onnx>=1.17"]  # scripts/train_labeller.py only, never the door or the worker; a GPU wants PyTorch's CUDA build (docs/howto.md, "The small labeller")
dev = ["pytest>=8", "ruff", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
prax = "prax_cli.main:main"       # the command; clients/cli/

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prax", "clients/cli/prax_cli"]

[tool.hatch.build.targets.wheel.force-include]
"src/prax/migrations" = "prax/migrations"
"src/prax/ui" = "prax/ui"

[tool.pytest.ini_options]
pythonpath = ["src", "clients/cli"]

[tool.mypy]
# what the type hints promise, checked (niggles.txt, 2026-09-27): the
# default mode at zero; strict mode (976 on that day) is later, file by
# file. The optional extras (usearch, onnxruntime, docling, pymupdf…)
# ship no types, so their imports are taken as they are.
files = ["src/prax"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["E501"]

[tool.ruff.lint.per-file-ignores]
# runs on old machines too (Python 2.7 and 3): the Python 3 idioms stay out
"clients/send/prax_send.py" = ["UP"]
