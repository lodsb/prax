[project]
name = "prax"
version = "0.0.1"
description = "Personal research knowledge base: SQLite, hybrid search, an evidence-bearing graph, doors for people and models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["knowledge-base", "sqlite", "fts5", "retrieval", "knowledge-graph", "mcp", "zotero"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=2,<3",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "pyyaml>=6",
    "anthropic>=1",
    "httpx>=0.27",
    "networkx>=3",  # the regions of the library (prax.graph.communities)
]

[project.optional-dependencies]
ingest = ["pymupdf4llm", "rapidocr", "python-bidi>=0.6", "trafilatura", "magika", "striprtf", "pillow", "py3langid"]   # parsing; rapidocr is what the OCR extractor runs (declared: it used to arrive with Docling and left with it) and python-bidi what it needs for right-to-left scripts; magika: code detection; py3langid: the language of a text (prax.text.language falls back to stopwords without it)
docling = ["docling"]                         # optional extractor; ~3 GB of PyTorch
embed = ["usearch>=2.12", "onnxruntime", "tokenizers", "numpy"]  # Stage 2; Windows GPU: onnxruntime-directml instead (never both)
serve = ["prax[embed]"]                       # the door on the board: the core plus vectors for hybrid search; nothing else
work = ["prax[embed,ingest]"]                 # the worker on the machine with the models: parse, titles, extract, embed
latex = ["pypandoc_binary"]                    # `prax import latex`: pandoc, for papers with their LaTeX source (about 40 MB); where the import runs, never the door
tray = ["pystray>=0.19", "pillow"]           # the tray icon of `prax up --tray` on a desktop
train = ["torch>=2.8", "transformers>=5.17,<6", "onnx>=1.17"]  # scripts/train_labeller.py only, never the door or the worker; a GPU wants PyTorch's CUDA build (docs/howto.md, "The small labeller")
dev = ["pytest>=8", "ruff", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
prax = "prax_cli.main:main"       # the command; clients/cli/

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prax", "clients/cli/prax_cli"]

[tool.hatch.build.targets.wheel.force-include]
"src/prax/migrations" = "prax/migrations"
"src/prax/ui" = "prax/ui"

[tool.pytest.ini_options]
pythonpath = ["src", "clients/cli"]

[tool.mypy]
# what the type hints promise, checked (niggles.txt, 2026-09-27). Strict
# mode's flags, without implicit re-exports (the store re-exports by
# design, invariant 3): the first batch on 2026-09-30 (prax.text, writing,
# wall, ml, config, worker, host.schedule, steps.base), the whole package
# on 2026-10-03 after 66 fixes, mostly a typed local where an untyped
# library's value is returned. The optional extras (usearch, onnxruntime,
# docling, pymupdf…) ship no types, so their imports are taken as they
# are, and calls into pymupdf and striprtf as untyped.
files = ["src/prax", "clients/cli/prax_cli"]
# the CLI is checked against the package it calls (2026-10-03), not as Any
mypy_path = ["src", "clients/cli"]
# a pack's own tests are tests, checked as little as those in tests/
exclude = ["src/prax/packs/[^/]+/tests/"]
ignore_missing_imports = true
untyped_calls_exclude = ["pymupdf", "striprtf"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
strict_equality = true
extra_checks = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# pyupgrade, bugbear, simplify and comprehensions besides the defaults; and a
# ceiling on a function's complexity, at the worst there was after the
# engineering pass of 2026-09-30 (video.parse): nothing grows past it
extend-select = ["E501", "UP", "B", "SIM", "C4", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 21

[tool.ruff.lint.per-file-ignores]
# runs on old machines too (Python 2.7 and 3): the Python 3 idioms stay out
"clients/send/prax_send.py" = ["UP", "SIM105"]
# the ceiling is the package's: a command line's main and a measurement
# script are one long argument parser by nature
"clients/**" = ["C901"]
"scripts/**" = ["C901"]
