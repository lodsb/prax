[project]
name = "prax"
version = "0.0.1"
description = "Personal research knowledge base: SQLite, hybrid search, an evidence-bearing graph, doors for people and models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["knowledge-base", "sqlite", "fts5", "retrieval", "knowledge-graph", "mcp", "zotero"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=2,<3",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "pyyaml>=6",
    "anthropic>=1",
    "httpx>=0.27",
]

[project.optional-dependencies]
ingest = ["pymupdf4llm", "trafilatura", "magika"]   # Stage 1 parse queue (batch host); magika: code detection for text attachments
docling = ["docling"]                         # optional extractor; ~3 GB of PyTorch
embed = ["usearch>=2.12", "onnxruntime", "tokenizers", "numpy"]  # Stage 2; Windows GPU: onnxruntime-directml instead (never both)
serve = ["prax[embed]"]                       # the door on the board: the core plus vectors for hybrid search; nothing else
work = ["prax[embed,ingest]"]                 # the worker on the machine with the models: parse, titles, extract, embed
dev = ["pytest>=8", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prax"]

[tool.hatch.build.targets.wheel.force-include]
"src/prax/migrations" = "prax/migrations"
"src/prax/ui" = "prax/ui"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["E501"]
