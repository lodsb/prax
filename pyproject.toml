[project]
name = "prax"
version = "0.0.1"
description = "Personal research knowledge base: SQLite + FastAPI + FastMCP"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "fastmcp>=4,<5",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "pyyaml>=6",
    "anthropic>=1",
]

[project.optional-dependencies]
ingest = ["pymupdf4llm", "trafilatura", "magika"]   # Stage 1 parse queue (batch host); magika: code detection for text attachments
docling = ["docling"]                         # optional extractor; ~3 GB of PyTorch
embed = ["usearch>=2.12", "onnxruntime", "tokenizers", "huggingface_hub", "numpy"]  # Stage 2; Windows GPU: onnxruntime-directml instead
local = ["llama-cpp-python>=0.3.35"]           # GGUF models in-process; CUDA wheel index + nvidia-*-cu12 runtime on Windows, docs/howto.md 3f
dev = ["pytest>=8", "ruff", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prax"]

[tool.hatch.build.targets.wheel.force-include]
"src/prax/migrations" = "prax/migrations"
"src/prax/ui" = "prax/ui"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["E501"]
