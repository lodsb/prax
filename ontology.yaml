# prax ontology — keep this SMALL. Extraction emits triples only against the
# current version; anything that doesn't fit goes to the review queue.
# `prax.store.link` rejects edges whose types are not listed here.
#
# Growing it: add types, bump `version`. Edges keep the version they were
# written under. Renaming or removing a type is a data migration, not an
# edit of this file. Format details: src/prax/ontology.py.
#
# v1 (2026-09-09): descriptions rewritten as instructions for the extractor
# (prax.extraction builds its prompt from this file); `venue` added so
# publication context has a home; `cites` requires a title the paper names.
# v2 (2026-09-10): from the review queue after 1,021 extracted documents
# (docs/ontology-v2.md): `uses`, `about`, `extends` and `proposes` widened
# to the shapes the models kept producing; `defines`, `contrasts` and
# `advised_by` added; method-versus-concept and reference-number rules put
# into the descriptions. `related_to` and a music `work` type deliberately
# left out for now.
# v3 (2026-09-10): pages (rationale R15). Entity types `page` and `project`
# for the living documents in the store; `annotates` and `part_of` connect
# them to papers and to each other; `cites` and `about` accept a page as
# source, so an extracted page enters the graph like a paper.
version: "5"

entity_types:
  paper:
    description: >-
      A document in the store, named by its title. The document being
      extracted is always a paper; other papers appear when the text names
      them by title. A bracketed reference number is never a name.
  author:
    description: >-
      A person or group that wrote something. Name as printed, full form,
      no titles or affiliations.
  venue:
    description: >-
      A journal, conference series or publisher where a paper appeared
      (IEEE ICASSP, JAES, DAFx, Springer).
  concept:
    description: >-
      An idea, topic, phenomenon or quantity a document is about: source
      separation, pitch perception, aliasing, room acoustics. Lowercase
      noun phrase, singular, no articles. The field a technique belongs to
      is a concept; the technique itself is a method, never both under one
      name.
  method:
    description: >-
      A named algorithm, technique or procedure: nonnegative matrix
      factorization, extended Kalman filter, wave digital filter, PLP.
      Use the established name, expand acronyms once in the name if the
      text does. A technique is a method, not also a concept.
  dataset:
    description: >-
      A named corpus, benchmark or measurement set: MUSDB18, NSynth,
      a specific HRTF database.
  tool:
    description: >-
      Software, hardware, a library or an instrument used or built:
      Matlab, Csound, Web Audio API, a specific synthesizer.
  claim:
    description: >-
      One sentence stating a result or assertion the document makes, in
      the document's own terms ("SSST resolves close tones that SST
      merges"). Only for central findings.
  page:
    description: >-
      A page written in this library (a note on a document, a topic
      write-up, a synthesis across several sources), named by its title. Only the document being extracted can
      be a page, when its header says "Kind: page"; never create a page
      from the text, and a web page in the text is a paper.
  project:
    description: >-
      An ongoing research thread in this library, named by its title.
      Only the document being extracted can be a project, when its header
      says "Kind: project". A research project a paper mentions (a funded
      programme, a consortium) is an organization, not a project.
  organization:
    description: >-
      A university, department, lab, company, funder, consortium or
      standards body named in the text: Chalmers University of Technology,
      LMA-CNRS, Waves Audio, Austrian Science Fund. Full name as printed,
      no city or country unless part of the name.

relation_types:
  cites:
    domain: [paper, page, project]
    range: [paper]
    description: >-
      the document names another paper by title; never by reference number
  authored_by:
    domain: [paper]
    range: [author]
    description: a listed author of the document
  published_in:
    domain: [paper]
    range: [venue]
    description: the venue the document appeared in
  about:
    domain: [paper, claim, page, project]
    range: [concept, method, tool, dataset]
    description: >-
      the document or claim is substantially about the concept, method or
      tool; something discussed at length, not mentioned in passing
  defines:
    domain: [paper, claim]
    range: [concept]
    description: the document gives the concept its definition
  implements:
    domain: [tool, method]
    range: [concept, method]
    description: a tool or method realizes a concept or another method
  extends:
    domain: [paper, method, concept, tool]
    range: [method, concept, tool, paper]
    description: >-
      the document, method, concept or tool builds on or generalizes a
      method, concept, tool or an earlier paper
  contrasts:
    domain: [paper, method, claim, tool]
    range: [method, claim, paper, tool, concept]
    description: >-
      the document sets the two against each other (compared with,
      as opposed to); for claims that cannot both hold use contradicts
  contradicts:
    domain: [claim, page]
    range: [claim]
    description: two claims cannot both hold; a page argues against a claim
  supports:
    domain: [claim, paper, page]
    range: [claim]
    description: evidence in favour of a claim; a page argues for it
  uses:
    domain: [paper, method, tool]
    range: [dataset, tool, method, concept]
    description: >-
      the document, method or tool employs a dataset, tool, method or
      applies a concept
  proposes:
    domain: [paper, author, page]
    range: [method, tool, claim, concept]
    description: >-
      the document introduces the method, tool, claim or concept as its
      own contribution; or the text credits a named person with
      introducing it
  advised_by:
    domain: [author]
    range: [author]
    description: doctoral or research supervision stated in the text
  annotates:
    domain: [page]
    range: [paper, page]
    description: a page written about one document (a note, a commentary, an addendum)
  synthesizes:
    domain: [page, project]
    range: [paper, page]
    description: >-
      a synthesis page draws on the document as one of its sources; the
      page's own claims then carry supports and contradicts edges from
      the papers
  part_of:
    domain: [paper, page]
    range: [project, paper]
    description: >-
      the document belongs to a project's reading list or thread; or a
      chapter, article or section is part of a book or proceedings volume
  mentions:
    domain: [paper, page, project]
    range: [tool, method, dataset, concept]
    description: >-
      the document names a tool, method, dataset or concept without using
      it or being about it (related work, an aside). The weakest relation:
      use it only when nothing stronger holds; never for something the
      document uses or is substantially about
  affiliated_with:
    domain: [author]
    range: [organization]
    description: the author's institution as stated in the document
  funded_by:
    domain: [paper, project]
    range: [organization]
    description: a funder or grant programme acknowledged in the document
  developed_by:
    domain: [tool]
    range: [organization, author]
    description: who built or makes the tool, as the text states it
