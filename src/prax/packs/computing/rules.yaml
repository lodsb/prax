# The domain rules the computing pack suggests (docs/packs.md); a person
# tries them with POST /domains/dry-run and copies the ones wanted into
# prax.yaml. From the rules of 2026-09-30: after studio's audio and music
# rules, so audio software stays studio's.
- match: {genre: paper, subject: computing}
  domains: [research, computing]
- match: {subject: computing}
  domains: [computing]
- match: {subject: ai}
  domains: [computing]
