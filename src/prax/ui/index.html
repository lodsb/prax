<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>prax</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // the chosen theme, before the first paint (settings live in this
    // browser only: localStorage, never sent to the door)
    try {
      var s = JSON.parse(localStorage.getItem("prax.settings") || "{}");
      if (s.theme && s.theme !== "system") document.documentElement.dataset.theme = s.theme;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#search">prax</a>
    <nav>
      <a href="#search" data-view="search">Search</a>
      <a href="#ask" data-view="ask">Ask</a>
      <a href="#browse" data-view="browse">Browse</a>
      <a href="#graph" data-view="graph">Graph</a>
      <a href="#review" data-view="review">Review</a>
      <a href="#pages" data-view="pages">Pages</a>
      <a href="#promote" data-view="promote">Promote</a>
      <a href="#inbox" data-view="inbox">Inbox</a>
      <a href="#jobs" data-view="jobs">Jobs<span id="jobs-badge" class="count" hidden></span></a>
    </nav>
    <form id="quick" class="quick" autocomplete="off">
      <input id="quick-q" type="search" placeholder="search the store…" aria-label="search">
    </form>
    <span id="status" class="status"></span>
    <button id="settings-btn" class="gear" type="button" title="settings" aria-label="settings">&#9881;</button>
  </header>
  <dialog id="settings">
    <form id="settings-form" method="dialog">
      <h2>Settings</h2>
      <p class="muted">Kept in this browser only.</p>
      <label>Theme
        <select name="theme">
          <option value="system">follow the system</option>
          <option value="light">light</option>
          <option value="dark">dark</option>
          <option value="paper">paper</option>
        </select>
      </label>
      <label>Passages per ask <input name="ask_limit" type="number" min="1" max="20"></label>
      <label>Search hits <input name="search_limit" type="number" min="5" max="100"></label>
      <div class="dialog-actions"><button value="ok">Done</button></div>
    </form>
  </dialog>
  <main id="view"></main>
  <script src="vendor/marked.min.js"></script>
  <script src="lib.js"></script>
  <script src="app.js"></script>
</body>
</html>
