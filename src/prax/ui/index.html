<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>prax</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#search">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="prax-mark" role="img" aria-label="the praxinoscope, prax's mark">
      <g style="mix-blend-mode: var(--prax-blend, multiply);"><path d="M52.6 25.6 C 55 24.8 58.4 25.4 59.6 26.4 C 60.2 32 59.8 40 59.4 46.6 C 56.6 47.4 54 47.2 52.2 46.6 C 51.8 39.5 52.2 32 52.6 25.6 Z" fill="var(--prax-colour, #8e2f24)"/></g>
      <g fill="none" stroke="var(--prax-key, #241d17)" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="50" cy="24" rx="8.6" ry="2.7"/>
      <path d="M41.4 24 L41.4 46.6" stroke-width="2.0"/><path d="M43.0 24 L43.0 46.6" stroke-width="2.0"/><path d="M47.3 24 L47.3 46.6" stroke-width="2.0"/><path d="M52.7 24 L52.7 46.6" stroke-width="2.0"/><path d="M56.96 24 L56.96 46.6" stroke-width="2.0"/><path d="M58.6 24 L58.6 46.6" stroke-width="2.0"/>
      <ellipse cx="50" cy="40" rx="30" ry="7.5"/>
      <path d="M20 40 L20 60"/><path d="M80 40 L80 60"/>
      <path d="M20 60 A 30 7.5 0 0 0 80 60"/>
      <path d="M26.7 46.9 L26.7 62.5" stroke-width="2.0"/><path d="M41.2 49.4 L41.2 65.0" stroke-width="2.0"/><path d="M50.0 49.7 L50.0 65.3" stroke-width="2.0"/><path d="M58.8 49.4 L58.8 65.0" stroke-width="2.0"/><path d="M73.3 46.9 L73.3 62.5" stroke-width="2.0"/>
      <path d="M46.6 67.5 C 47.2 69.8 47.4 71 47.5 72.2"/><path d="M53.4 67.5 C 52.8 69.8 52.6 71 52.5 72.2"/><ellipse cx="50" cy="72.6" rx="6.2" ry="1.9"/><path d="M47.3 74.2 C 42.8 78 43.6 80.4 46.6 82"/><path d="M52.7 74.2 C 57.2 78 56.4 80.4 53.4 82"/><ellipse cx="50" cy="82.4" rx="4.4" ry="1.4"/><path d="M46.2 83.4 C 43.4 84.6 41 85.4 38.6 86"/><path d="M53.8 83.4 C 56.6 84.6 59 85.4 61.4 86"/><ellipse cx="50" cy="86.4" rx="11.6" ry="3.1"/><path d="M38.6 86.8 C 36.4 87.8 34.2 88.6 32.6 89.2"/><path d="M61.4 86.8 C 63.6 87.8 65.8 88.6 67.4 89.2"/><ellipse cx="50" cy="89.4" rx="17.4" ry="4.2"/>
      </g>
      </svg>
      <span class="wordmark">prax</span>
    </a>
    <nav>
      <a href="#search" data-view="search">Search</a>
      <a href="#ask" data-view="ask">Ask</a>
      <a href="#browse" data-view="browse">Browse</a>
      <a href="#graph" data-view="graph">Graph</a>
      <a href="#review" data-view="review">Review</a>
      <a href="#pages" data-view="pages">Pages</a>
      <a href="#promote" data-view="promote">Promote</a>
      <a href="#inbox" data-view="inbox">Inbox</a>
      <a href="#jobs" data-view="jobs">Jobs<span id="jobs-badge" class="count" hidden></span></a>
    </nav>
    <form id="quick" class="quick" autocomplete="off">
      <svg viewBox="-7 -7 14 14" aria-hidden="true"><path d="M0 -5.4 C 0.8 -1.8 1.9 -0.7 5.3 0.2 C 1.8 0.9 0.7 2 -0.2 5.4 C -0.9 1.9 -2 0.8 -5.4 -0.2 C -1.9 -0.9 -0.8 -2 0 -5.4 Z" fill="var(--prax-colour)"/></svg>
      <input id="quick-q" type="search" placeholder="search the library" aria-label="search">
    </form>
    <span id="status" class="status"></span>
    <button id="settings-btn" class="gear" type="button" title="settings" aria-label="settings">&#9881;</button>
  </header>
  <dialog id="settings">
    <form id="settings-form" method="dialog">
      <h2>Settings</h2>
      <p class="muted">Kept in this browser only.</p>
      <label>Theme
        <select name="theme">
          <option value="system">follow the system (Bindery by day, Night in the dark)</option>
          <option value="bindery">Bindery</option>
          <option value="dessau">Dessau</option>
          <option value="riso">Riso</option>
          <option value="cyanotype">Cyanotype</option>
          <option value="night">Night</option>
          <option value="funk">Funk</option>
        </select>
      </label>
      <label>Passages per ask <input name="ask_limit" type="number" min="1" max="20"></label>
      <label>Search hits <input name="search_limit" type="number" min="5" max="100"></label>
      <div class="dialog-actions"><button value="ok">Done</button></div>
    </form>
  </dialog>
  <main id="view"></main>
  <script src="vendor/marked.min.js"></script>
  <script src="lib.js"></script>
  <script src="app.js"></script>
</body>
</html>
