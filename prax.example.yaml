# prax.yaml: which model does which step. Copy to the data directory
# (PRAX_DATA_DIR/prax.yaml, or point PRAX_CONFIG at it). Environment
# variables PRAX_<STEP> (a model name below, or "none") override a step for
# one run; PRAX_<STEP>_MODEL swaps the Claude model id. docs/howto.md 3k.

models:
  # the Claude API; the key comes from ANTHROPIC_API_KEY
  sonnet:
    kind: claude
    model: claude-sonnet-5
    effort: medium
  opus:
    kind: claude
    model: claude-opus-5
    effort: medium

  # A local model served by llama.cpp's llama-server (the usual way; any
  # OpenAI-compatible server works the same: vLLM, Ollama with its
  # /v1 endpoint). `repo` and `file` say where the GGUF comes from:
  #   prax models fetch local-server
  # puts it under <data dir>/models/<repo>/<file> (a 24 GB card; a 7B Q4
  # file fits 8 GB). `serve:` is how `prax up` starts llama-server for it
  # (run: below): the port from base_url, the context per slot from n_ctx.
  # `model` is the name edges carry as their producer, so name the file.
  local-server:
    kind: openai
    base_url: http://127.0.0.1:8080/v1
    model: qwen3.6-35b-a3b-ud-q4ks
    repo: unsloth/Qwen3.6-35B-A3B-GGUF
    file: Qwen3.6-35B-A3B-UD-Q4_K_S.gguf
    n_ctx: 8192              # the context of each slot
    serve:
      slots: 3
      # path: /elsewhere/model.gguf   # instead of the fetched file
      # mmproj: mmproj-F16.gguf       # the projector beside it: images too
      # cpu_moe: 2           # a MoE model's expert weights of the first N
      #                      #   layers in RAM: VRAM for the display (howto 3h)
      # ubatch: 256          # smaller compute buffers
      # image_max_tokens: 1024
      # thinking: false      # off: extraction under a grammar must not think
      # reranker: true       # a cross-encoder server instead (run: reranker)

  # A hosted OpenAI-compatible API (api_key_env names the variable holding
  # its key; price is USD per million input and output tokens, for the
  # cost lines). Private material should not go to a third party.
  # deepseek:
  #   kind: openai
  #   base_url: https://api.deepseek.com/v1
  #   model: deepseek-chat
  #   api_key_env: DEEPSEEK_API_KEY
  #   price: [0.27, 1.10]

# which ontology modules a document is read against (the domains pass of prax maintain;
# first match wins; a rule without match is the default; a person's choice on
# the document page is never overwritten)
domains:
  - match: {collection: Family}
    domains: [family]
  - match: {path: kitchen/}      # dropped into data/inbox/kitchen/
    domains: [kitchen]
  - match: {path: workshop/}     # …/workshop/: builds, repairs, plans
    domains: [workshop]
  - match: {tag: recipe}         # a Zotero tag, a tag sent with a capture
    domains: [kitchen]
  - match: {source: capture}     # pages sent from the browser
    domains: [research]
  - domains: [research]

steps:
  extract:
    model: local-server   # the pass over everything: local, free; sonnet for quality
    max_triples: 20
  promote:            # the expensive pass over flagged documents (prax work --steps promote --spend)
    model: sonnet
    max_triples: 30
  ask:
    model: local-server   # or `none`: the bundle alone, the caller's model answers
    # steps: 8            # surfing steps before the answer (0: the first search alone)
    # tokens: 4000        # their reading budget; clamped to the model's context
    #                     #   (n_ctx of the model above, less ~2,200 of prompt)
  titles:
    model: local-server
  vision:
    model: sonnet
  typing:               # the review queue's untyped items (prax work --steps typing)
    model: local-server
  adjudicate:
    model: opus
  # formulas:           # a reading in words under each display equation
  #   model: local-server   #   (marker's LaTeX, howto 3h); none by default

# ---------------------------------------------------------------------------
# What this host does, as opposed to which model it asks. Every setting below
# has a sane default; an environment variable of the same name in brackets
# overrides it for one run (PRAX_EMBED=hash pytest). Delete what you do not
# need — an empty section is the default.

# embeddings:
#   model: bge-small-en-v1.5   # [PRAX_EMBED] `0` off, `hash` for tests
#   variant: int8              # [PRAX_EMBED_VARIANT] int8 (faster) or fp32
#   providers: [DmlExecutionProvider, CPUExecutionProvider]  # [PRAX_EMBED_PROVIDERS]
#   threads: 0                 # [PRAX_EMBED_THREADS] 0: onnxruntime decides

# vectors:
#   dtype: f16                 # [PRAX_VEC_DTYPE] f16 (recall .98) or i8 (.93,
#                              #   half the file: the board's setting)
#   ef: 64                     # [PRAX_VEC_EF] search expansion

# rerank:
#   model: "0"                 # [PRAX_RERANK] off; a cross-encoder name, or `stub`
#   variant: int8              # [PRAX_RERANK_VARIANT]
#   providers: []              # [PRAX_RERANK_PROVIDERS]

# parse:
#   ocr_max_pages: 60          # [PRAX_OCR_MAX_PAGES] budget of the OCR extractor
#   ocr_language: ch           # [PRAX_OCR_LANGUAGE] the recognizer's script: ch
#                              #   (Chinese and English), en, latin, arabic,
#                              #   cyrillic, devanagari, japan, korean, el, th…
#   ocr_gpu: false             # [PRAX_OCR_GPU] DirectML (onnxruntime-directml)
#   max_layout_mb: 200         # [PRAX_MAX_LAYOUT_MB] above this, no layout analysis
#   layout_window: 100         # [PRAX_LAYOUT_WINDOW] pages per pass of layout analysis (marker too)
#   figures: captioned         # [PRAX_FIGURES] which figures the vision model
#                              #   reads: captioned | all, either with -again to
#                              #   read what it has read before, once more
#   comments: true             # [PRAX_COMMENTS] a page's comment section under
#                              #   its own heading (the corrections, the jokes)
#   marker_url: http://127.0.0.1:8765   # [PRAX_MARKER_URL] marker's server (run: marker)
#   formula_readings: new      # [PRAX_FORMULA_READINGS] the formulas extractor reads
#                              #   the unread equations, or `again` every one
#   marker_mode: fast          # [PRAX_MARKER_MODE] fast | balanced (the vision model lays out too)

# citations:
