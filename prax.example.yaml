# sources:
#   github:
#     user: octocat            # [PRAX_GITHUB_USER] whose stars `prax import github` reads
#     token: ghp_…             # [PRAX_GITHUB_TOKEN] better kept in the environment
#                              #   (5,000 requests an hour instead of 60; your own stars)

# paths:
#   models: /path/to/models    # [PRAX_MODELS_DIR] where fetched model files go
#   backup: /path/to/copy      # [PRAX_BACKUP] where `prax backup` copies the store
#   llama_server: /path/to/llama-server   # [PRAX_LLAMA_SERVER] the binary (howto 3h)

# What this host runs, kept running by `prax up` (howto 4b): started in
# this order, the worker once the door answers; `prax up --install` starts
# them at login. Leave out what this host does not run.
# run:
#   llama-server: {model: local-server}     # a models: entry with a serve: block
#   # reranker: {model: ranker}             # a second server, serve: {reranker: true}
#   # marker: {venv: /path/to/marker-venv, on_demand: true}   # PDF to LaTeX (howto 3h);
#   #                                       #   ngl: 99 layers on the card; on demand: --start marker
#   door: {host: 0.0.0.0, port: 8000}       # ssl_certfile and ssl_keyfile for HTTPS
#   worker:
#     interval: 20                          # seconds between passes
#     nightly: "03:00"                      # one pass over the whole library a day
#     nightly_limit: 100                    #   (the backlog, the stale texts)
#     # spend: true                         # the paid steps run (promote, adjudicate)
#     # steps: [parse, titles, extract, embed, resolve, adjudicate]
#     # door: http://board:8000             # a door elsewhere (else this host's)

# The door's clock: what it runs on itself at that hour, as jobs on the
# Jobs page. The jobs table remembers, so a door restarted at noon does
# not run the night again, and one that was down at the hour catches up.
# schedule:
#   maintain: "03:30"                       # every pass; or {at: …, only: [acronyms]}
#   backup: {at: "04:30", archive: false}   # to paths.backup; archive: false
#                                           #   leaves the originals out
