<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>prax capture</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="popup">
  <header>
    <strong>prax</strong>
    <span id="server" class="muted">…</span>
    <a href="#" id="options" title="server, token, defaults">options</a>
  </header>
  <section id="choices">
    <div id="domains" class="chips"><span class="muted">domains…</span></div>
    <input id="tags" type="text" placeholder="tags, comma-separated">
    <label class="row"><input id="close" type="checkbox"> close tabs after sending</label>
  </section>
  <p id="sites" class="muted" hidden>Pictures and fonts in a snapshot, and tabs in the background, need
    <a href="#" id="grant-sites">access to all sites</a> (asked once; the popup may close, open it again).</p>
  <section class="actions">
    <button id="send-tab">Send this tab</button>
    <button id="send-window" class="secondary">Send all tabs in window</button>
  </section>
  <section id="progress" hidden>
    <div id="bar"><div id="fill"></div></div>
  </section>
  <section id="recent" hidden>
    <div class="row between"><span class="muted">recent sends</span><span><a href="#" id="retry-failed" class="muted" hidden>retry failed</a> <a href="#" id="clear-history" class="muted">clear</a></span></div>
    <ul id="results"></ul>
  </section>
  <p id="msg" class="error"></p>
  <details id="diag"><summary class="muted">diagnostics</summary><pre id="log"></pre><a href="#" id="clear-log">clear</a></details>
  <script src="lib.js"></script>
  <script src="popup.js"></script>
</body>
</html>
