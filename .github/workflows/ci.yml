# What a stranger's machine would find: the suite on Linux and Windows,
# and the README's quick start in a fresh venv (scripts/smoke.sh). No
# model runs, no money, nothing fetched but the packages from PyPI (a
# fresh store has no vectors, so a search never loads the embedder).
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[serve,work,dev]"
      - name: ruff
        run: |
          ruff check .
          ruff format --check .
      - name: mypy
        run: mypy
      # the maths pack's calculator runs in an environment of its own
      # (SymPy 1.14 and ANTLR 4.11; OCR pins ANTLR 4.9 in prax's), so its
      # tests run here only when this one exists and PRAX_MATHS_PYTHON names it
      - name: the maths pack's environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/maths-venv"
          py="$RUNNER_TEMP/maths-venv/bin/python"
          [ -x "$py" ] || py="$RUNNER_TEMP/maths-venv/Scripts/python.exe"
          "$py" -m pip install --quiet "sympy==1.14.0" "antlr4-python3-runtime==4.11.*"
          echo "PRAX_MATHS_PYTHON=$py" >> "$GITHUB_ENV"
      - name: pytest
        run: pytest -q -p no:cacheprovider

  smoke:
    name: quick start in a fresh venv
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: the README's quick start
        run: bash scripts/smoke.sh
