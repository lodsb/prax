# The words that say what a name is, and the words that say a name is not
# one. Data, beside the types they are about, rather than regular
# expressions in `prax.graph.review` — which is where they lived until
# 2026-09-24, invisible to the ontology they describe, so growing
# research.yaml grew nothing here and nothing said it should
# (docs/stratification.md, stratum C).
#
# `prax.graph.ontology.lexicon()` loads this; `prax.graph.review` builds its patterns
# from it. A `stem` matches from the start of a word onwards, so
# "universit" catches university, universities and Universität. A `word`
# must be the whole word: "mit" is MIT and not Smith, which is the
# difference between an institute and a person, and a test holds it.
#
# It bumps no module version. A cue changes what the typing rules guess
# about a misfit, never what triples the ontology accepts, so no document
# needs re-extracting when one is added — and the loader keeps this file
# out of the composed modules so it cannot join the version string.
#
# Measure a change: docs/eval/typing-rules-2026-09-24.md says what these
# words are worth against the typing model, rule by rule.
version: 1

# a name carrying one of these is an organization. Deliberately wide: an
# organization word beats the shape of a name, because "Stanford
# University" and "Waves Audio" are both two capitalized words
organization:
  stems:
    - universit
    - institut
    - laborator
    - department
    - dept.
    - faculty
    - school
    - college
    - centre
    - center
    - foundation
    - council
    - academy
    - gmbh
    - corporation
    - company
    - research
    - cnrs
    - ircam
    - ccrma
    - hochschule
    - fraunhofer
    - association
    - society
    - consortium
    - programme
    - agency
    - ministry
    - technolog
    - audio
    - software
    - systems
    - instruments
    - electronics
    - devices
    - networks
    - solutions
    - media
    - records
    - project
  words:
    - lab
    - labs
    - fund
    - inc
    - inc.
    - ltd
    - group
    - studio
    - studios
    - program
    - mit

# an organization that contains others rather than sitting inside one: a
# lab is part of a university, never the other way round
top_organization:
  stems:
    - universit
    - hochschule
    - college
    - institute of technology
    - gmbh
    - ltd
    - corporation
    - foundation
    - ministry
    - agency
  words:
    - inc

# a word in a name that says which type it is. The first type whose cue
# matches wins, so the order of the types here is the precedence
by_type:
  # a container a work appeared in, which the extraction prompt now asks
  # for as a venue. Kept here too, because a name already in the graph is
  # past the prompt: `prax heal --check container-entities` reads these
  venue:
    - proceedings
    - symposium
    - transactions on
    - journal of
    - conference on
    - workshop on
    - annual meeting
    - congress of
  tool:
    - tool
    - software
    - library
    - plugin
    - service
    - system
  method:
    - method
    - algorithm
    - technique
  dataset:
    - dataset
    - corpus
    - database
    - benchmark
  concept:
    - concept

# a name that is not a name: what a model writes when it has nothing
not_a_name:
  # matched whole, lowercased and with runs of space collapsed
  exact:
    - unknown
    - none
    - n/a
    - n.d.
    - s.n.
    - "[s.n.]"
    - "s.n.]"
    - "?"
    - "-"
    - title
    - no claims
    - no authors
    - no author
    - not stated
    - author not listed
    - not listed
    - no author listed
    - author unknown
    - "[venue not stated]"
    - various
    - author
    - authors
    - paper
    - source
    - target
    - entity
    - document
  # a name that begins with one of these is a pointer, not a thing: "this
  # inference scheme", "the proposed method". Matched case-sensitively on
  # purpose, so "The Beatles" and "Various Artists" survive
  vague_start:
    - this
    - these
    - those
    - our
    - the proposed
    - a proposed
    - specific
    - various
    - different
    - several
    - some
    - other
  # a name that begins with one of these is not a thing at all, whatever
  # its case
  never_start:
    - unknown
    - (unknown
    - supporting document

# which end of a `part_of` is the part. A model writes the relation the
# wrong way round often enough to matter ("Diskrete Strukturen II part_of
# Übungsblatt 07", a university part_of a lecture), and the rule pass
# carries one such fact into every chain through it (stage AN, measured
# 5 of 20 right before this check). `ontology.part_of_suspect` reads
# these; a suspect goes to the review queue instead of the graph, and
# `prax heal --check backwards-part-of` lists the ones already written
part_of:
  # a name carrying one of these is a part of something: a sheet of a
  # course, a chapter of a book, an exam of a lecture
  part:
    stems:
      - übungsblatt
      - lösungsblatt
      - aufgabenblatt
      - hausaufgabe
      - tutoraufgabe
      - musterlösung
      - klausur
      - endklausur
      - homework
      - assignment
      - exercise sheet
      - problem set
      - appendix
      - anhang
    words:
      - blatt
      - aufgabe
      - sheet
      - exam
      - exercise
  # these count only with a number after them: "Teil 1", "Vol 6",
  # "Lecture 3", "page 4 of 12", "Chapter 32"
  numbered:
    - teil
    - part
    - vol
    - vol.
    - volume
    - no.
    - nr.
    - band
    - heft
    - issue
    - lecture
    - vorlesung
    - lesson
    - unit
    - session
    - week
    - woche
    - page
    - seite
    - section
    - chapter
    - kapitel
    - abschnitt
    - ch.
  # a name carrying one of these holds parts rather than being one: a
  # course, a series, a journal, a manual. Not "guide": a user guide is as
  # often a part of a product line as the whole of anything
  whole:
    stems:
      - manual
      - documentation
      - dokumentation
      - lehrveranstaltung
      - studiengang
      - curriculum
      - proceedings
      - tagungsband
      - journal
      - encyclopedia
      - enzyklopädie
      - anthology
      - anthologie
      - magazin
      - occasional papers
    words:
      - course
      - kurs
      - series
      - reihe
      - conference
      - standard
  # a whole that is a kind of thing rather than one: "Aufgabe 1 part_of
  # course" says nothing, and the closure makes every exercise of every
  # course a part of the one entity named "course". Matched whole,
  # lowercased, an article in front allowed
  generic:
    - course
    - lecture
    - seminar
    - project
    - research
    - research project
    - interdisciplinary project
    - conference volume
    - book
    - series
    - collection
    - document
    - paper
  # how far up an organization sits: a lab in a department, a department
  # in a faculty, a faculty in a university. The highest rank a name
  # holds is its rank, so "Institute of Technology" is a university and
  # "Group, Universitat Pompeu Fabra" one too
  ranks:
    1:
      stems: [laborator, lehrstuhl]
      words: [lab, labs, group, chair, team, arbeitsgruppe]
    2:
      stems: [institut, department, abteilung, dept., centre, center, zentrum]
      words: [division]
    3:
      stems: [faculty, fakultät, fachbereich]
      words: [school]
    4:
      stems: [universit, hochschule, institute of technology, academy, akademie]
      # not "mit": in German it is "with" ("Synchronisation mit Semaphoren")
      words: [tu, eth, epfl]

# what the extraction typed as a venue and is not one: a paper is not
# "published in" its publisher, its university or a semester (stage AN,
# the `not-venues` ailment of `prax heal`). Each kind says what the fact
# was meant to be. A name that carries a venue word (journal,
# proceedings, conference, review…: `venue_words` in the research pack's
# lexicon, src/prax/packs/research/lexicon.yaml) is a venue whatever else
# it says, so "Journal of the Audio Engineering Society" stays
not_a_venue:
  # published_in becomes published_by
  publisher:
    stems: [verlag, publishing, publisher]
    words: [press, "university press", "& sons", springer, elsevier, wiley, routledge, pergamon, "academic press", mcgraw-hill, addison-wesley, "o'reilly", "taylor & francis", "springer-verlag", birkhäuser, kluwer]
  # a company: published_by too (a manual and its maker)
  company:
    stems: [gmbh]
    words: [inc, inc., ltd, ltd., llc, corporation, corp., ag, "co. kg", ohg, bv, s.a., sarl]
  # published_in becomes written_at
  institution:
    words: [university, universität, universitaet, université, università, universidad, universiteit, college, hochschule, institute, institut, department, fakultät, faculty, laboratory, lab, labs, rechenzentrum, universitätsbibliothek, "school of music", conservatory, konservatorium]
  # no venue and no fact: the edge ends
  none:
    stems: [übungsblatt, lösungsblatt, aufgabenblatt, hausaufgabe, vorlesung, licen, lizenz]
    words: [assignment, homework, lecture, "lecture notes", "lecture slides", "course materials", "exercise sheet", exercises]

# what a project's note says of itself near its top (`prax.text.status`,
# stage AL step 5): the state words by state, in each language a note may
# be written in. A word counts on a line of its own shape: after a key
# ("Status: veraltet"), or at the line's start as a marker: alone,
# emphasised (**Deprecated**), in capitals, or followed by a colon, a dash,
# a date or one of `after` ("Superseded by plan-v2.md"). "Archived copies
# of the data live on the NAS" is a sentence, not a status (the quality
# review of 2026-10-05, finding 7).
status:
  keys: [status, zustand, statut, estado, stato]
  states:
    retired: [retired, withdrawn, archived, abandoned, zurückgezogen, archiviert, eingestellt, retiré, archivé, abandonné]
    superseded: [superseded, replaced, obsolete, outdated, ersetzt, überholt, veraltet, abgelöst, remplacé, obsolète, périmé]
    invalid: [invalid, invalidated, void, wrong, retracted, ungültig, falsch, widerrufen, invalide]
    deprecated: [deprecated, abgekündigt, déprécié]
    current: [current, active, accepted, final, approved, valid, aktuell, gültig, aktiv, actuel]
    draft: [draft, proposed, wip, entwurf, brouillon]
  # what makes a line that opens with a state word a status: "Superseded
  # by …", "Retired since 2026-10", "Veraltet seit …"
  after: [by, since, "on", as of, in favour of, in favor of, durch, seit, am, ab, par, depuis]
