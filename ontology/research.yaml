# prax ontology, research module: papers, methods, claims and the pages of
# this library. Requires core (person, organization, document, concept,
# tool). Extraction emits triples only against the composed ontology;
# anything that does not fit goes to the review queue. Growing it: add
# types, bump `version`. Edges keep the version they were written under.
#
# v1 (2026-09-09): descriptions rewritten as instructions for the extractor
# (prax.extraction builds its prompt from this file); `venue` added so
# publication context has a home; `cites` requires a title the paper names.
# v2 (2026-09-10): from the review queue after 1,021 extracted documents
# (docs/ontology-v2.md): `uses`, `about`, `extends` and `proposes` widened
# to the shapes the models kept producing; `defines`, `contrasts` and
# `advised_by` added; method-versus-concept and reference-number rules put
# into the descriptions.
# v3 (2026-09-10): pages (rationale R15): `page` and `project`, `annotates`
# and `part_of`.
# v4 (2026-09-11): synthesis pages, `synthesizes`; pages may argue claims.
# v5 (2026-09-12, docs/ontology-v5.md): organizations, `mentions`, wider
# `contrasts`, `extends`, `about`, `part_of`. On the same day the file was
# split: person, organization, concept, tool, affiliated_with and
# developed_by moved to core.yaml; author, paper, venue, page and project
# became subtypes of core types. The composed version is core1+research5.
# v6 (2026-09-13, docs/ontology-v6.md): from the 18,848 items the v5
# re-read left in the queue: `written_at` (the institution a document came
# out of; the models wrote it as affiliated_with 2,800 times), `mentions`
# from any document to any kind of thing (it is the weak relation),
# `about` from any document and towards people, organizations, places,
# events and works, `authored_by` towards an organization that issued the
# document, `published_in` from any document.
# v7 (2026-09-13, docs/ontology-v7.md): `authored_by` and `part_of` moved
# to core (every kind of document has authors and belongs to something;
# `part_of` now holds between organizations too). Nothing else changed.
# v8 (2026-09-22, docs/ontology-v8.md): aliases only — what the models
# kept saying for relations that exist: `is_about`, `proposed`, and the
# reversed names `mentioned_in`, `discussed_in`, `used_in`, `used_by`,
# `cited_by`, which flip the ends. No type or relation changed.
module: research
version: 8
requires: [core]
self_types: [paper]

entity_types:
  paper:
    parent: document
    description: >-
      A document in the store, named by its title. The document being
      extracted is always a paper; other papers appear when the text names
      them by title. A bracketed reference number is never a name.
  author:
    parent: person
    description: >-
      A person or group that wrote something. Name as printed, full form,
      no titles or affiliations.
  venue:
    parent: organization
    description: >-
      A journal, conference series or publisher where a paper appeared
      (IEEE ICASSP, JAES, DAFx, Springer).
  method:
    description: >-
      A named algorithm, technique or procedure: nonnegative matrix
      factorization, extended Kalman filter, wave digital filter, PLP.
      Use the established name, expand acronyms once in the name if the
      text does. A technique is a method, not also a concept.
  dataset:
    description: >-
      A named corpus, benchmark or measurement set: MUSDB18, NSynth,
      a specific HRTF database.
  claim:
    description: >-
      One sentence stating a result or assertion the document makes, in
      the document's own terms ("SSST resolves close tones that SST
      merges"). Only for central findings.
  page:
    parent: document
    description: >-
      A page written in this library (a note on a document, a topic
      write-up, a synthesis across several sources), named by its title.
      Only the document being extracted can be a page, when its header
      says "Kind: page"; never create a page from the text, and a web page
      in the text is a paper.
  project:
    parent: document
    description: >-
      An ongoing research thread in this library, named by its title.
      Only the document being extracted can be a project, when its header
      says "Kind: project". A research project a paper mentions (a funded
      programme, a consortium) is an organization, not a project.

relation_types:
  cites:
    domain: [paper, page, project]
    range: [paper]
    description: >-
      the document names another paper by title; never by reference number
  written_at:
    domain: [document]
    range: [organization]
    description: >-
      the institution the document came out of, as it states it (the
      authors' affiliation on the first page, the company behind a
      manual); affiliated_with is for a person, this is for the document
  published_in:
    domain: [document]
    range: [venue]
    description: the venue the document appeared in
  about:
    domain: [document, claim]
    range: [concept, method, tool, dataset, person, organization, place, event, work]
    description: >-
      the document or claim is substantially about the concept, method,
      tool, dataset — or the person, organization, place, event or work
      it studies; something discussed at length, not mentioned in passing
  defines:
    domain: [paper, claim]
    range: [concept]
    description: the document gives the concept its definition
  implements:
    domain: [tool, method]
    range: [concept, method]
    description: a tool or method realizes a concept or another method
  extends:
    domain: [paper, method, concept, tool]
    range: [method, concept, tool, paper]
    description: >-
      the document, method, concept or tool builds on or generalizes a
      method, concept, tool or an earlier paper
  contrasts:
    domain: [paper, method, claim, tool]
    range: [method, claim, paper, tool, concept]
    description: >-
      the document sets the two against each other (compared with,
      as opposed to); for claims that cannot both hold use contradicts
  contradicts:
    domain: [claim, page]
    range: [claim]
    description: two claims cannot both hold; a page argues against a claim
  supports:
    domain: [claim, paper, page]
    range: [claim]
    description: evidence in favour of a claim; a page argues for it
  uses:
    domain: [paper, method, tool]
    range: [dataset, tool, method, concept]
    description: >-
      the document, method or tool employs a dataset, tool, method or
      applies a concept
  proposes:
    domain: [paper, author, page]
    range: [method, tool, claim, concept]
    description: >-
      the document introduces the method, tool, claim or concept as its
      own contribution; or the text credits a named person with
      introducing it
  advised_by:
    domain: [author]
    range: [author]
    description: doctoral or research supervision stated in the text
  annotates:
    domain: [page]
    range: [paper, page]
    description: a page written about one document (a note, a commentary, an addendum)
  synthesizes:
    domain: [page, project]
    range: [paper, page]
    description: >-
      a synthesis page draws on the document as one of its sources; the
      page's own claims then carry supports and contradicts edges from
      the papers
  mentions:
    domain: [document]
    range: [tool, method, dataset, concept, person, organization, document, place, event, work]
    description: >-
      the document names a thing — a tool, method, dataset, concept,
      person, organization, another document, a place, an event, a work —
      without using it or being about it (related work, an aside). The
      weakest relation: use it only when nothing stronger holds; never for
      something the document uses, cites or is substantially about
  funded_by:
    domain: [paper, project]
    range: [organization]
    description: a funder or grant programme acknowledged in the document

type_aliases:
  technique: method
  algorithm: method
  corpus: dataset
  benchmark: dataset
  finding: claim
  journal: venue
  conference: venue

relation_aliases:
  supervised_by: advised_by
  produced_at: written_at
  from_institution: written_at
  discusses: mentions
  builds_on: extends
  compares: contrasts
  is_about: about
  proposed: proposes
  mentioned_in: {to: mentions, reversed: true}
  discussed_in: {to: mentions, reversed: true}
  used_in: {to: uses, reversed: true}
  used_by: {to: uses, reversed: true}
  cited_by: {to: cites, reversed: true}
