# Ask eval set: questions about the middle of long documents (2026-10-06),
# each written from a passage at least 30% into the text, never from the
# section summaries or the document's summary, which are what is measured.
#   expect_doc   the document's id in the full store
#   expect       a regex the cited passage should match
#   style        middle
# Run: python scripts/eval_ask.py --questions tests/eval/questions-sections.yaml
questions:
  # research books and theses
  - q: "When estimating the fundamental frequency in order to link analysis frames by their harmonic structure, why were time-domain methods such as autocorrelation ruled out?"
    expect_doc: 13401
    expect: 'polyphony'
    style: middle
    where: "offset 300000 of 687609 (44%), p. 107"
  - q: "On the test PC, how many times faster could the combined autocorrelation/FFT representation be computed than an FFT magnitude spectrum of matching accuracy?"
    expect_doc: 8681
    expect: '3\.3 times|6360'
    style: middle
    where: "offset 70000 of 142195 (49%), p. 47-48"
  - q: "Why should a ligand for capture on a streptavidin sensor surface carry, ideally, fewer than one biotin label per molecule?"
    expect_doc: 10002
    expect: 'biotinylation|homogeneous'
    style: middle
    where: "offset 600000 of 1262521 (48%), p. 255-256"
  - q: "Which Russian researcher separated 'paradox' creativity, original ideas that compensate for cognitive weaknesses, from productive creativity, and what four criteria of creative intellect did she propose?"
    expect_doc: 927
