# Retrieval eval set against the FULL Zotero store (not the fixture).
#
# Expectations are title regexes (case-insensitive), so duplicates of the
# same paper all count. Written from the documents' own abstracts:
#   keyword    words that appear in the title or abstract verbatim
#   paraphrase the idea in other words (the vector side has to carry it)
#   structure  a specific table or figure, searched with a kind filter
# Run: python scripts/eval_retrieval.py --store C:/prax-data \
#          --queries tests/eval/queries-library.yaml

queries:
