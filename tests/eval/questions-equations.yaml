# Ask eval set: questions whose answer is an equation in one of the 21
# papers read with marker on 2026-09-16/17 (every display equation a
# `formula` chunk with a reading in words). Written from the readings.
#
#   expect_doc   the document the equation is in (its id in the full store)
#   expect       a regex the cited formula's LaTeX or reading should match
#   style        named     the question names the equation or the thing
#                meaning   the question says what the equation does, in other words
#
# Run: python scripts/eval_ask.py --questions tests/eval/questions-equations.yaml
#      (against the door, PRAX_DOOR / PRAX_TOKEN; the ask step's model answers)

questions:
  - q: what is the Shockley diode equation as the diode clipper WDF paper writes it
    expect_doc: 9272
    expect: "Shockley|I_s"
    style: named
  - q: how is the diode current written in the wave domain, in terms of the incident and reflected waves a and b
    expect_doc: 9272
    expect: "wave domain|incident and reflected|a\\+b|a-b"
    style: meaning
